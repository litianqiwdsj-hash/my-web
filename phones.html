const GROUP_LABEL = {cn:{t:"中国本土機（国行）",c:"b-cn"}, jp:{t:"日本で買える中国機",c:"b-jp"}, jpnav:{t:"日本本土機",c:"b-intl"}};
const FIELD_LABEL = {release:"発売時期", soc:"チップ", cam:"カメラ", screen:"画面", battery:"バッテリー/充電", ram:"メモリ/容量", price:"価格", note:"備考"};

function groupOptions(g){
  const list = PHONES.filter(p=>p.group===g);
  return list.map(p=>`<option value="${p.id}">${p.name}${p.verified?"":"（要確認）"}</option>`).join('');
}
function fillSelects(){
  const selA=document.getElementById('selA'), selB=document.getElementById('selB');
  const byGroup={};
  PHONES.forEach(p=>{(byGroup[p.group]=byGroup[p.group]||[]).push(p)});
  const mkOpts=(sel,preset)=>{
    let h='<option value="">— 機種を選ぶ —</option>';
    for(const g in GROUP_LABEL){
      if(!byGroup[g])continue;
      h+=`<optgroup label="${GROUP_LABEL[g].t}">`;
      byGroup[g].forEach(p=>{h+=`<option value="${p.id}">${p.name}</option>`});
      h+='</optgroup>';
    }
    sel.innerHTML=h;
    if(preset){const idx=[...sel.options].findIndex(o=>o.value===preset);if(idx>=0)sel.selectedIndex=idx;}
  };
  mkOpts(selA,'xiaomi17_cn');
  mkOpts(selB,'xiaomi17ultra_jp');
}
function render(){
  const a=document.getElementById('selA').value, b=document.getElementById('selB').value;
  const box=document.getElementById('result');
  if(!a||!b){box.innerHTML=`<div class="empty"><i>⚖</i>両方の機種を選んでください</div>`;document.getElementById('srcnote').textContent='';return;}
  const PA=PHONES.find(p=>p.id===a), PB=PHONES.find(p=>p.id===b);
  const grpA=GROUP_LABEL[PA.group], grpB=GROUP_LABEL[PB.group];
  let rows='';
  for(const f in FIELD_LABEL){
    rows+=`<tr><th>${FIELD_LABEL[f]}</th><td class="${f==='note'?'hl-y':''}">${PA[f]}</td><td class="${f==='note'?'hl-y':''}">${PB[f]}</td></tr>`;
  }
  box.innerHTML=`
  <table class="cmp">
    <thead><tr>
      <th style="width:22%">項目</th>
      <th>${PA.name} <span class="badge ${grpA.c}">${grpA.t}</span></th>
      <th>${PB.name} <span class="badge ${grpB.c}">${grpB.t}</span></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  const verNot=PHONES.filter(p=>p.id===a||p.id===b).some(p=>!p.verified);
  document.getElementById('srcnote').textContent = verNot
    ? "※「要確認」の機種は未検証データです。公式仕様で確認してから掲載してください。" 
    : "出典：中国＝中関村在线/IT之家/百度百科/各社中国公式(国行発売価格)。日本＝MM総研(シェア)/各社日本公式・報道/楽天・KDDI/エディオン。仕様・価格は調査時点(2026/09)のもので変動あり。FeliCa対応は各機種の日本仕様に依存。";
}

document.getElementById('selA').addEventListener('change',render);
